services:
  # Backend FastAPI Web Service
  - type: web
    name: hr-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: oregon
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hr-postgres-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: GOOGLE_CLIENT_ID
        value: 64576092611-tlgd7s6jcubbtmk94ho741tjebvjdtbo.apps.googleusercontent.com
      - key: FRONTEND_URL
        fromService:
          type: web
          name: hr-frontend
          property: url
      - key: ALLOWED_ORIGINS
        fromService:
          type: web
          name: hr-frontend
          property: url
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: HR & Employee Management Portal
      - key: SMTP_TLS
        value: "true"

  # Frontend Next.js Web Service
  - type: web
    name: hr-frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    region: oregon
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: hr-backend
          property: url
      - key: INTERNAL_API_URL
        fromService:
          type: web
          name: hr-backend
          property: url
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        value: 64576092611-tlgd7s6jcubbtmk94ho741tjebvjdtbo.apps.googleusercontent.com
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

databases:
  - name: hr-postgres-db
    databaseName: hr_db
    user: postgres
    region: oregon
    plan: free
