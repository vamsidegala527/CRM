name: Keep Render Backend Alive

on:
  schedule:
    # Runs every 10 minutes (Render free tier spins down after 15 minutes)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  keep-alive:
    name: Ping Render Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping Backend
        env:
          # If configured in GitHub Repo Settings -> Secrets/Variables, it will use that.
          # Otherwise it uses the default URL below.
          BACKEND_URL: ${{ vars.RENDER_BACKEND_URL || secrets.RENDER_BACKEND_URL || 'https://crm-xmev.onrender.com' }}
        run: |
          echo "Pinging $BACKEND_URL/api/health at $(date -u)"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$BACKEND_URL/api/health" || echo "000")
          echo "Response HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 301 ] || [ "$HTTP_STATUS" -eq 302 ]; then
            echo "✅ Backend is awake and healthy!"
          elif [ "$HTTP_STATUS" -eq 502 ] || [ "$HTTP_STATUS" -eq 503 ] || [ "$HTTP_STATUS" -eq 504 ]; then
            echo "⚠️ Backend was asleep and is now waking up (status $HTTP_STATUS). The ping triggered the cold-start!"
          else
            echo "ℹ️ Backend responded with HTTP $HTTP_STATUS"
          fi
